name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Build for linux/amd64 (t3)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o fretboard .

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy binary and restart service
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          scp $SSH_OPTS fretboard ec2-user@fretboard:/tmp/fretboard.new
          ssh $SSH_OPTS ec2-user@fretboard \
            'install -m 755 /tmp/fretboard.new /opt/fretboard/fretboard && rm /tmp/fretboard.new && sudo systemctl restart fretboard'

      - name: Smoke test
        run: |
          sleep 3
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://fretboard.tail9292f9.ts.net/ > /dev/null
          curl --fail --silent --show-error https://fretboard.tail9292f9.ts.net/api/me | grep '"enabled"'
